{% extends 'base.html' %}
{% block title %}Book with {{ organization.name }}{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-4">Book an appointment with {{ organization.name }}</h1>
<form method="post" class="bg-white border rounded p-4 grid gap-3 max-w-xl">
  {% csrf_token %}
  <label class="grid gap-1">Service
    <select name="service" class="border rounded p-2" required>
      {% for item in services %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}
    </select>
  </label>
  <label class="grid gap-1">Staff
    <select name="staff" class="border rounded p-2" required>
      {% for member in staff %}<option value="{{ member.id }}">{{ member.user.email }}</option>{% endfor %}
    </select>
  </label>
  <label class="grid gap-1">Start datetime (ISO)
    <input name="start_datetime" class="border rounded p-2" placeholder="2026-08-01T10:00:00+00:00" required>
  </label>
  <label class="grid gap-1">Full name
    <input name="customer_name" class="border rounded p-2" required>
  </label>
  <label class="grid gap-1">Email
    <input name="customer_email" type="email" class="border rounded p-2" required>
  </label>
  <label class="grid gap-1">Phone
    <input name="customer_phone" class="border rounded p-2">
  </label>
  <button class="px-4 py-2 rounded bg-slate-900 text-white">Confirm booking</button>
</form>
{% endblock %}
